[workspace]
name = "fatebook-android"
description = "Fatebook prediction-tracking Android app"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Bootstrap/fallback runner only; builds use ./gradlew (wrapper pins 8.11.1).
gradle = ">=8.11"
# Gradle 8.11 cannot run on the JDK 25 that conda-forge gradle otherwise pulls in.
openjdk = "21.*"

[activation.env]
ANDROID_HOME = "/home/russell/Android/Sdk"

[tasks]
# Build / install / run: release is the default, -debug variants use the .debug appId.
build = { cmd = "./gradlew assembleRelease", description = "Assemble the release APK" }
build-debug = { cmd = "./gradlew assembleDebug", description = "Assemble the debug APK" }
install = { cmd = "./gradlew installRelease", description = "Build and install the release APK on the connected adb device" }
install-debug = { cmd = "./gradlew installDebug", description = "Build and install the debug APK on the connected adb device" }
run = { cmd = "adb shell am start -n dev.russell.fatebook/dev.russell.fatebook.MainActivity", depends-on = ["install"], description = "Install the release APK and launch it" }
run-debug = { cmd = "adb shell am start -n dev.russell.fatebook.debug/dev.russell.fatebook.MainActivity", depends-on = ["install-debug"], description = "Install the debug APK and launch it" }
clean = { cmd = "./gradlew clean", description = "Delete all Gradle build outputs" }

# Verification
test = { cmd = "./gradlew testDebugUnitTest", description = "Run JVM unit tests" }
test-screenshot-record = { cmd = "./gradlew recordPaparazziDebug", description = "Regenerate Paparazzi golden images" }
test-screenshot-verify = { cmd = "./gradlew verifyPaparazziDebug", description = "Compare against Paparazzi golden images" }
test-all = { cmd = "./gradlew testDebugUnitTest verifyPaparazziDebug", description = "Unit tests + screenshot verify" }
lint = { cmd = "./gradlew lintDebug", description = "Run Android lint on the debug variant" }
check = { cmd = "./gradlew lintDebug testDebugUnitTest verifyPaparazziDebug --continue", description = "Everything CI checks before a release (lint + unit + screenshot tests)" }

# Device inspection
logs = { cmd = "adb logcat --pid=$(adb shell pidof -s dev.russell.fatebook)", description = "Logcat for the running release app" }
